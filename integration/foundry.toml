[profile.default]
src = "src"
out = "out"
cache_path = "cache"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@account-abstraction/=../.deps/account-abstraction/contracts/", "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]
allow_paths = ["../.deps", "../node_modules"]
